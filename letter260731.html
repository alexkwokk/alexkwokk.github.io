<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffb6c1">
<title>黄素清宝宝 💌</title>
<script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #ffd1dc 0%, #ffe4e9 50%, #fff0f5 100%);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* === 通用层 === */
  .stage {
    position: fixed; inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }
  .stage.active { display: flex; }

  /* === Stage 1: 信封 === */
  #stage-envelope { z-index: 5; }

  .falling-envelope {
    position: absolute;
    top: -60px;
    font-size: 32px;
    pointer-events: none;
    animation: fall linear forwards;
    will-change: transform;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0.6; }
  }

  .big-envelope {
    font-size: 140px;
    line-height: 1;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
    animation: bounceIn 1s ease;
  }
  @keyframes bounceIn {
    0% { transform: scale(0); }
    60% { transform: scale(1.2); }
    80% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  .title-hint {
    margin-top: 12px;
    font-size: 16px;
    color: #c45a7a;
    letter-spacing: 2px;
  }

  .btn-row {
    margin-top: 36px;
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100%;
    height: 60px;
  }
  .btn {
    border: none;
    border-radius: 30px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    transition: transform 0.18s ease, left 0.25s ease, top 0.25s ease;
    white-space: nowrap;
  }
  .btn-open   { background: linear-gradient(135deg, #ff7eb3, #ff4081); }
  .btn-skip   { background: linear-gradient(135deg, #bdc3c7, #95a5a6); }
  .btn-cold   { background: linear-gradient(135deg, #74b9ff, #0984e3); }
  .btn-hot    { background: linear-gradient(135deg, #ff7675, #d63031); }
  .btn-forgive{ background: linear-gradient(135deg, #fd79a8, #e84393); }
  .btn-bad    { background: linear-gradient(135deg, #636e72, #2d3436); }

  /* === Stage 2: 信件 === */
  #stage-letter {
    z-index: 10;
    background: linear-gradient(135deg, #ffd1dc 0%, #ffe4e9 50%, #fff0f5 100%);
  }
  .letter-paper {
    width: min(92vw, 480px);
    max-height: 78vh;
    overflow-y: auto;
    background: #fffaf0;
    border-radius: 16px;
    padding: 26px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    border: 1px solid #ffe4e1;
    -webkit-overflow-scrolling: touch;
  }
  .letter-paper::-webkit-scrollbar { width: 4px; }
  .letter-paper::-webkit-scrollbar-thumb { background: #ffb6c1; border-radius: 4px; }

  .letter-to {
    font-size: 18px;
    color: #d6336c;
    font-weight: 700;
    text-align: center;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }
  .letter-body {
    font-size: 15.5px;
    line-height: 1.9;
    color: #5a3d3d;
    text-align: justify;
    white-space: pre-wrap;
  }
  .letter-sign {
    margin-top: 18px;
    text-align: right;
    color: #c45a7a;
    font-style: italic;
  }

  .violence-row {
    margin-top: 24px;
    display: flex;
    gap: 18px;
    justify-content: center;
    width: 100%;
    position: relative;
    height: 60px;
  }

  /* === Stage 3: 攻击 ggh === */
  #stage-attack { z-index: 15; }
  .attack-title {
    font-size: 22px;
    color: #d6336c;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .attack-sub {
    font-size: 13px;
    color: #b07a8a;
    margin-bottom: 24px;
  }
  .ggh-target {
    font-size: 72px;
    font-weight: 900;
    color: #ff4081;
    text-shadow: 0 4px 12px rgba(0,0,0,0.1);
    margin-bottom: 28px;
    transition: transform 0.12s ease, filter 0.12s ease;
    user-select: none;
  }
  .ggh-letter.l2 { left: 154px; top: 10px; }
  .weapon-row {
    display: flex;
    gap: 22px;
    margin-bottom: 28px;
  }
  .weapon {
    font-size: 48px;
    background: #fff;
    width: 72px; height: 72px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 14px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .weapon:active { transform: scale(0.85); }

  .action-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    position: relative;
    width: 100%;
    height: 60px;
  }

  /* === 飘屏文字/表情 === */
  .floater {
    position: fixed;
    pointer-events: none;
    font-weight: 800;
    will-change: transform, opacity;
    z-index: 999;
  }
  .floater.text {
    font-size: 28px;
    color: #ff3366;
    text-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .floater.emoji {
    font-size: 32px;
  }

  @keyframes popNo {
    0%   { transform: translate(0,0) scale(0.2) rotate(0deg); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot)); opacity: 0; }
  }
  @keyframes flyUp {
    0%   { transform: translate(0,0) scale(0.4); opacity: 0; }
    15%  { opacity: 1; transform: translate(0,-30px) scale(1.1); }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.9); opacity: 0; }
  }
  @keyframes burstHeart {
    0%   { transform: translate(-50%, 0) scale(0.3); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), var(--ty)) scale(1.2); opacity: 0; }
  }

/* === Combo 数字（连击） === */
.combo {
  position: fixed;
  left: 50%;
  top: 22%;
  transform: translate(-50%, 0) scale(0.4);
  font-size: 88px;
  font-weight: 900;
  color: #ffeb3b;
  -webkit-text-stroke: 3px #ff3366;
  text-shadow:
    0 0 12px rgba(255, 51, 102, 0.6),
    0 6px 0 #d6336c,
    0 12px 24px rgba(0,0,0,0.25);
  pointer-events: none;
  z-index: 1000;
  opacity: 0;
  will-change: transform, opacity;
  letter-spacing: 4px;
}
.combo.bump {
  animation: comboPop 0.3s cubic-bezier(.18,.89,.32,1.28);
}
@keyframes comboPop {
  0%   { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
  50%  { transform: translate(-50%, -8px) scale(1.15); opacity: 1; }
  100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
}

  /* === ggh 炸裂 === */
  .ggh-wrap {
    position: relative;
    margin-bottom: 28px;
    width: 220px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ggh-letter {
    position: absolute;
    font-size: 72px;
    font-weight: 900;
    color: #ff4081;
    text-shadow: 0 4px 12px rgba(0,0,0,0.1);
    transition: none;
    will-change: transform, opacity, filter;
  }
  .ggh-letter.l0 { left: 14px;  top: 18px; }
  .ggh-letter.l1 { left: 92px;  top: 18px; }
  .ggh-letter.l2 { left: 154px; top: 10px; }

  .ggh-letter.shake {
    animation: gghShake 0.18s ease-in-out infinite;
  }
  @keyframes gghShake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    25%      { transform: translate(-3px, 2px) rotate(-3deg); }
    50%      { transform: translate(3px, -2px) rotate(3deg); }
    75%      { transform: translate(-2px, -2px) rotate(-2deg); }
  }

  .ggh-letter.flash {
    animation: gghFlash 0.25s ease-out;
  }
  @keyframes gghFlash {
    0%   { filter: hue-rotate(0deg) brightness(1); }
    40%  { filter: hue-rotate(60deg) brightness(1.4) saturate(1.6); }
    100% { filter: hue-rotate(0deg) brightness(1); }
  }

  /* 字母炸飞后的碎片 */
  .ggh-letter.shard {
    transition: none;
    animation: gghShard 0.9s cubic-bezier(.22,.61,.36,1) forwards;
  }
  @keyframes gghShard {
    0%   { opacity: 1; }
    100% {
      opacity: 0;
      transform:
        translate(calc(var(--sx, 0px) - 50%), calc(var(--sy, 0px) - 50%))
        rotate(var(--rot, 180deg))
        scale(0.4);
    }
  }

  /* ggh 整体重新聚合 */
  .ggh-letter.reform {
    animation: gghReform 0.45s cubic-bezier(.18,.89,.32,1.28);
  }
  @keyframes gghReform {
    0%   { opacity: 0; transform: scale(0.4) rotate(20deg); filter: blur(6px); }
    60%  { opacity: 1; transform: scale(1.15) rotate(-4deg); filter: blur(0); }
    100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
  }

  /* 屏幕震动 */
  #stage-attack.shake {
    animation: stageShake 0.16s ease-in-out;
  }
  @keyframes stageShake {
    0%, 100% { transform: translate(0, 0); }
    20%      { transform: translate(-6px, 4px); }
    40%      { transform: translate(6px, -3px); }
    60%      { transform: translate(-4px, -4px); }
    80%      { transform: translate(4px, 3px); }
  }

  /* === Stage 4: 结束页 love you === */
  #stage-love { z-index: 20; background: linear-gradient(135deg, #ffd1dc 0%, #ffe4e9 50%, #fff0f5 100%); }
  .love-title {
    font-size: 64px;
    font-weight: 900;
    color: #ff3366;
    letter-spacing: 4px;
    text-shadow:
      0 4px 0 #d6336c,
      0 8px 24px rgba(255, 51, 102, 0.35);
    animation: heartBeat 1.4s ease-in-out infinite;
    user-select: none;
  }
  .love-sub {
    margin-top: 14px;
    font-size: 14px;
    color: #c45a7a;
    letter-spacing: 2px;
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.12); }
    30%      { transform: scale(0.98); }
    45%      { transform: scale(1.08); }
    60%      { transform: scale(1); }
  }

  /* 持续飘屏的爱心 */
  .love-floater {
    position: fixed;
    pointer-events: none;
    will-change: transform, opacity;
    z-index: 999;
    bottom: -40px;
    animation: loveFloat linear forwards;
  }
  @keyframes loveFloat {
    0%   { transform: translate(0, 0) scale(0.6) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translate(var(--tx), var(--ty)) scale(1.1) rotate(var(--rot)); }
    100% { transform: translate(calc(var(--tx) * 2), calc(var(--ty) - var(--rise, 600px))) scale(0.7) rotate(calc(var(--rot) * 2)); opacity: 0; }
  }

  /* === 通用隐藏 === */
  .hide { display: none !important; }
</style>
</head>
<body>

<!-- ===== Stage 1: 信封飘落 ===== -->
<div class="stage active" id="stage-envelope">
  <div class="big-envelope">✉️</div>
  <div class="title-hint">有一封给你的信</div>
  <div class="btn-row" id="envelopeBtnRow">
    <button class="btn btn-open" id="btnOpen">打开 💌</button>
    <button class="btn btn-skip" id="btnSkip">不打开 🙈</button>
  </div>
</div>

<!-- ===== Stage 2: 信件内容 ===== -->
<div class="stage" id="stage-letter">
  <div class="letter-paper">
    <div class="letter-to">to 害羞腼腆文静宇宙超级无敌善良美丽大方的黄素清宝宝 💗</div>
    <div class="letter-body" id="letterBody"></div>
    <div class="letter-sign">love you</div>
  </div>
  <div class="violence-row" id="violenceRow">
    <button class="btn btn-cold" id="btnCold">冷暴力 🥶</button>
    <button class="btn btn-hot" id="btnHot">热暴力 🔥</button>
  </div>
</div>

<!-- ===== Stage 3: 攻击 ggh ===== -->
<div class="stage" id="stage-attack">
  <div class="attack-title">消消气，发泄一下 🥺</div>
  <div class="attack-sub">（疯狂点击下面的表情攻击 ggh）</div>
  <div class="ggh-wrap" id="gghWrap">
    <span class="ggh-letter l0" id="gghL0">g</span>
    <span class="ggh-letter l1" id="gghL1">g</span>
    <span class="ggh-letter l2" id="gghL2">h</span>
  </div>
  <!-- Combo 数字（连击时显示） -->
  <div class="combo" id="combo"></div>
  <div class="weapon-row" id="weaponRow">
    <div class="weapon" data-w="💣">💣</div>
    <div class="weapon" data-w="💩">💩</div>
    <div class="weapon" data-w="🐷">🐷</div>
  </div>
  <div class="action-row" id="actionRow">
    <button class="btn btn-forgive" id="btnForgive">不生气了 🥰</button>
    <button class="btn btn-bad" id="btnBad">sb ggh 😤</button>
  </div>
</div>

<!-- ===== Stage 4: 结束页 love you ===== -->
<div class="stage" id="stage-love">
  <div class="love-title">love you</div>
  <div class="love-sub">永远爱你 💗</div>
</div>

<script>
/* =====================================================
 * 工具函数
 * ===================================================== */
const $ = (id) => document.getElementById(id);
const rand = (min, max) => Math.random() * (max - min) + min;

/* =====================================================
 * Stage 1: 信封飘落
 * ===================================================== */
(function startFalling() {
  const stage = $('stage-envelope');
  const EMOJIS = ['✉️', '💌', '🌸', '💗', '💕'];
  const COUNT = 28;

  for (let i = 0; i < COUNT; i++) {
    const el = document.createElement('div');
    el.className = 'falling-envelope';
    el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    el.style.left = rand(0, 100) + 'vw';
    el.style.fontSize = rand(22, 44) + 'px';
    el.style.animationDuration = rand(4, 8) + 's';
    el.style.animationDelay = rand(0, 4) + 's';
    el.style.opacity = rand(0.6, 1);
    stage.appendChild(el);
  }
})();

/* 不打开按钮：每次点击移动 + 缩小 */
const btnSkip = $('btnSkip');
let skipScale = 1;
let skipX = 0, skipY = 0;
btnSkip.addEventListener('click', (e) => {
  e.preventDefault();
  skipScale = Math.max(0.25, skipScale - 0.12);
  const stage = $('stage-envelope');
  const rect = stage.getBoundingClientRect();
  const maxX = rect.width / 2 - 40;
  const maxY = 120;
  skipX = rand(-maxX, maxX);
  skipY = rand(-maxY, maxY);
  btnSkip.style.transform = `translate(${skipX}px, ${skipY}px) scale(${skipScale})`;
});
// 触摸时也触发（避免移动端 click 延迟）
btnSkip.addEventListener('touchstart', (e) => {
  e.preventDefault();
  btnSkip.click();
}, { passive: false });

/* 打开按钮 */
$('btnOpen').addEventListener('click', goToLetter);
function goToLetter() {
  $('stage-envelope').classList.remove('active');
  $('stage-letter').classList.add('active');
  // 清掉飘落信封，减少干扰
  document.querySelectorAll('.falling-envelope').forEach(el => el.remove());
}

/* =====================================================
 * Stage 2: 信件正文（占位文本，你最后再修改）
 * ===================================================== */
const letterText = `晚上惹你生气了是我不对，sorry 🙏

看车票的时候只顾自己的感觉，觉得几个小时的行程是可以接受的。
先去盯着更近更便宜（也没便宜多少）但更遭罪的火车，
忽略了你的感受，明明高铁是更好的选择。

我感觉我真的很笨的，回想起来，其实你早就有提醒我，但我没反应过来。

这是我的不好，不是💰的问题，是我考虑不周到。

宝，对不起！

`;
$('letterBody').textContent = letterText;

/* =====================================================
 * 冷暴力 / 热暴力
 * ===================================================== */
const btnCold = $('btnCold');
const btnHot  = $('btnHot');

btnCold.addEventListener('click', () => burstFromEdges('NO!', '#0984e3'));
btnHot.addEventListener('click',  () => burstFromEdges('ggh是sb', '#ff3366'));

/* 冷暴力按钮：点击后移动 + 缩小 */
let coldScale = 1;
btnCold.addEventListener('click', moveAndShrink.bind(null, btnCold, () => coldScale, v => coldScale = v));

/* 从屏幕四面八方爆出文字 */
function burstFromEdges(text, color) {
  const N = 22;
  for (let i = 0; i < N; i++) {
    const el = document.createElement('div');
    el.className = 'floater text';
    el.textContent = text;
    el.style.color = color;
    // 从四条边之一出发
    const side = Math.floor(Math.random() * 4); // 0上 1右 2下 3左
    let startX, startY, tx, ty;
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    switch (side) {
      case 0: startX = rand(0, window.innerWidth);  startY = -20;  tx = rand(-cx*0.6, cx*0.6); ty = rand(cy*0.4, cy*0.9); break;
      case 1: startX = window.innerWidth + 20;      startY = rand(0, window.innerHeight); tx = rand(-cx*0.9, -cx*0.3); ty = rand(-cy*0.5, cy*0.5); break;
      case 2: startX = rand(0, window.innerWidth);  startY = window.innerHeight + 20; tx = rand(-cx*0.6, cx*0.6); ty = rand(-cy*0.9, -cy*0.4); break;
      case 3: startX = -20;                         startY = rand(0, window.innerHeight); tx = rand(cx*0.3, cx*0.9);  ty = rand(-cy*0.5, cy*0.5); break;
    }
    el.style.left = startX + 'px';
    el.style.top  = startY + 'px';
    el.style.setProperty('--tx', tx + 'px');
    el.style.setProperty('--ty', ty + 'px');
    el.style.setProperty('--rot', rand(-180, 180) + 'deg');
    el.style.fontSize = rand(20, 40) + 'px';
    el.style.animation = `popNo ${rand(1.2, 2)}s ease-out forwards`;
    el.style.animationDelay = rand(0, 0.3) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }
}

function moveAndShrink(btn, getScale, setScale) {
  const rect = $('stage-letter').getBoundingClientRect();
  const maxX = rect.width / 2 - 50;
  const maxY = 100;
  const s = Math.max(0.3, getScale() - 0.15);
  setScale(s);
  btn.style.transform = `translate(${rand(-maxX, maxX)}px, ${rand(-maxY, maxY)}px) scale(${s})`;
}

/* 热暴力：点 1 次就飘屏 + 进入 Stage 3 */
btnHot.addEventListener('click', () => {
  burstFromEdges('ggh是sb', '#ff3366');
  goToAttack();
});
// 兜底：双击也直接进入
btnHot.addEventListener('dblclick', goToAttack);

function goToAttack() {
  $('stage-letter').classList.remove('active');
  $('stage-attack').classList.add('active');
}

/* =====================================================
 * Stage 4: 结束页 love you（持续飘爱心/亲亲）
 * ===================================================== */
let loveLoopTimer = null;

function goToLove() {
  $('stage-attack').classList.remove('active');
  $('stage-love').classList.add('active');

  // 先来一波爆发
  burstLove(40);

  // 之后持续飘屏（每 0.4s 飞 2-3 个）
  clearInterval(loveLoopTimer);
  loveLoopTimer = setInterval(() => burstLove(rand(2, 4)), 400);
}

function burstLove(n) {
  const EMOJIS = ['❤️','💖','💕','💘','💝','😘','💋','🥰','💗','💞'];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'love-floater';
    el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    el.style.left = rand(0, window.innerWidth) + 'px';
    el.style.fontSize = rand(22, 44) + 'px';
    const tx = rand(-80, 80);
    const ty = rand(-window.innerHeight * 0.4, 0);
    const rise = window.innerHeight + 120;
    el.style.setProperty('--tx', tx + 'px');
    el.style.setProperty('--ty', ty + 'px');
    el.style.setProperty('--rise', rise + 'px');
    el.style.setProperty('--rot', rand(-60, 60) + 'deg');
    el.style.animationDuration = rand(5, 9) + 's';
    el.style.animationDelay = rand(0, 1.2) + 's';
    document.body.appendChild(el);
    // 动画结束后清理（按 duration + delay 估算）
    setTimeout(() => el.remove(), (parseFloat(el.style.animationDuration) + parseFloat(el.style.animationDelay)) * 1000 + 200);
  }
}

/* =====================================================
 * Stage 3: 攻击 ggh（含连击 + 炸裂效果）
 * ===================================================== */
const gghWrap   = $('gghWrap');
const gghStage  = $('stage-attack');
const gghLetters = [$('gghL0'), $('gghL1'), $('gghL2')];
const comboEl   = $('combo');
const weapons   = document.querySelectorAll('.weapon');

/* --- 连击状态 --- */
let combo = 0;          // 当前连击数
let comboTimer = null;  // 1.5s 归零计时器
let isExploding = false; // 字母炸飞期间禁止叠加

weapons.forEach(w => {
  const trigger = (e) => {
    if (e) e.preventDefault();
    hitGgh(w.dataset.w, w);
    registerCombo();
  };
  w.addEventListener('click', trigger);
  w.addEventListener('touchstart', trigger, { passive: false });
});

function registerCombo() {
  // 累加，但最大只显示 x99（避免屏幕装不下）
  combo = Math.min(combo + 1, 99);
  comboEl.textContent = 'x' + combo;

  // 每次重新触发弹跳动画
  comboEl.classList.remove('bump');
  void comboEl.offsetWidth;
  comboEl.classList.add('bump');

  // 1.5s 不点击才淡出归零
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => {
    comboEl.classList.remove('bump');
    comboEl.style.opacity = '0';
    setTimeout(() => {
      combo = 0;
      comboEl.textContent = '';
    }, 300);
  }, 1500);
}

function hitGgh(emoji, fromEl) {
  // 1) 从武器位置往 ggh 飞 emoji（连击越高飞得越多，但有上限避免卡顿）
  const bullets = Math.min(4 + Math.floor(combo / 2), 14);
  flyBullets(emoji, fromEl, bullets);

  // 2) ggh 中心炸一下反馈
  burstAtGgh(emoji);

  // 3) 字母抖动 + 颜色闪烁
  if (!isExploding) {
    gghLetters.forEach(l => {
      l.classList.remove('shake', 'flash');
      void l.offsetWidth;
      l.classList.add('shake');
      setTimeout(() => l.classList.remove('shake'), 360);
    });
  }

  // 4) 屏幕震动（连击越高越猛）
  const intensity = Math.min(combo, 5);
  if (intensity >= 1) {
    gghStage.classList.remove('shake');
    void gghStage.offsetWidth;
    gghStage.style.setProperty('--shake-amp', (intensity * 1.5) + 'px');
    gghStage.classList.add('shake');
    setTimeout(() => gghStage.classList.remove('shake'), 160);
  }

  // 5) 连击 >= 4 直接炸裂（每 4 次炸一次，炸飞期间不重复）
  if (combo >= 4 && combo % 4 === 0 && !isExploding) {
    shatterGgh();
  }

  // 6) 闪光效果（combo 2 起）
  if (combo >= 2) {
    gghLetters.forEach(l => {
      l.classList.add('flash');
      setTimeout(() => l.classList.remove('flash'), 260);
    });
  }
}

/* 从表情位置抛出 emoji 飞向 ggh */
function flyBullets(emoji, fromEl, count) {
  const rect = fromEl.getBoundingClientRect();
  const targetRect = gghWrap.getBoundingClientRect();
  const startX = rect.left + rect.width / 2;
  const startY = rect.top + rect.height / 2;
  const endX = targetRect.left + targetRect.width / 2;
  const endY = targetRect.top + targetRect.height / 2;

  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'floater emoji';
    p.textContent = emoji;
    p.style.left = startX + 'px';
    p.style.top  = startY + 'px';
    p.style.fontSize = (24 + Math.random() * 18) + 'px';
    const tx = (endX - startX) + rand(-40, 40);
    const ty = (endY - startY) + rand(-40, 40);
    p.style.setProperty('--tx', tx + 'px');
    p.style.setProperty('--ty', ty + 'px');
    p.style.animation = `flyUp ${rand(0.35, 0.55)}s ease-out forwards`;
    p.style.animationDelay = (i * 0.03) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }
}

/* 在 ggh 中心爆一下 emoji */
function burstAtGgh(emoji) {
  const targetRect = gghWrap.getBoundingClientRect();
  const cx = targetRect.left + targetRect.width / 2;
  const cy = targetRect.top + targetRect.height / 2;
  const blobs = 3 + Math.min(combo, 5);
  for (let i = 0; i < blobs; i++) {
    const hit = document.createElement('div');
    hit.className = 'floater emoji';
    hit.textContent = emoji;
    hit.style.left = cx + 'px';
    hit.style.top  = cy + 'px';
    hit.style.fontSize = (50 + Math.random() * 30) + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist  = 80 + Math.random() * 80;
    hit.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    hit.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    hit.style.animation = `burstHeart 0.6s ease-out forwards`;
    document.body.appendChild(hit);
    setTimeout(() => hit.remove(), 800);
  }
}

/* ggh 三个字母炸开 -> 0.9s 后聚合回来 */
function shatterGgh() {
  isExploding = true;
  // 震动再叠一次
  gghStage.classList.remove('shake');
  void gghStage.offsetWidth;
  gghStage.classList.add('shake');
  setTimeout(() => gghStage.classList.remove('shake'), 220);

  // 屏幕再来一波冲击波圆环（emoji 抛得更猛）
  for (let k = 0; k < 18; k++) {
    const ring = document.createElement('div');
    ring.className = 'floater emoji';
    ring.textContent = ['💥','✨','💢','⚡'][Math.floor(Math.random()*4)];
    ring.style.left = '50%';
    ring.style.top = '40%';
    ring.style.fontSize = (30 + Math.random()*30) + 'px';
    const a = (k / 18) * Math.PI * 2;
    const d = 160 + Math.random() * 80;
    ring.style.setProperty('--tx', Math.cos(a) * d + 'px');
    ring.style.setProperty('--ty', Math.sin(a) * d + 'px');
    ring.style.animation = `burstHeart 0.9s ease-out forwards`;
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 1100);
  }

  gghLetters.forEach((l, i) => {
    l.classList.remove('shake', 'flash');
    const angle = Math.random() * Math.PI * 2;
    const dist  = 120 + Math.random() * 90;
    l.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    l.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
    l.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    l.classList.add('shard');
  });

  // 0.9s 后聚合回来
  setTimeout(() => {
    gghLetters.forEach(l => {
      l.classList.remove('shard');
      l.style.removeProperty('--sx');
      l.style.removeProperty('--sy');
      l.style.removeProperty('--rot');
      l.classList.add('reform');
      setTimeout(() => l.classList.remove('reform'), 450);
    });
    isExploding = false;
  }, 900);
}

/* =====================================================
 * 不生气了 / sb ggh
 * ===================================================== */
const btnForgive = $('btnForgive');
const btnBad     = $('btnBad');

btnForgive.addEventListener('click', goToLove);
btnBad.addEventListener('click', () => {
  shower(['💔','🩹'], '#7f8c8d');
  moveAndShrink(btnBad, () => badScale, v => badScale = v);
});

let badScale = 1;
// 也让 sb ggh 一开始就能被点中（缩小逻辑已包含）

/* 满屏飘屏 emoji */
function shower(emojis, color) {
  const N = 35;
  for (let i = 0; i < N; i++) {
    const el = document.createElement('div');
    el.className = 'floater emoji';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.color = color;
    el.style.left = rand(0, window.innerWidth) + 'px';
    el.style.top  = (window.innerHeight + 40) + 'px';
    el.style.fontSize = rand(24, 44) + 'px';
    const tx = rand(-60, 60);
    const ty = rand(-window.innerHeight - 200, -window.innerHeight * 0.6);
    el.style.setProperty('--tx', tx + 'px');
    el.style.setProperty('--ty', ty + 'px');
    el.style.animation = `flyUp ${rand(2.5, 4.5)}s ease-out forwards`;
    el.style.animationDelay = rand(0, 1) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }
}

/* 防止移动端双击放大/选中等 */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
