<style>

    box-sizing: border-box;
    margin: 0;
    padding: 0;

    width: 100%;

  body {
    display: grid;

  .line {
    font-weight: 300;
    letter-spacing: 0.02em;
    text-align: center;
    line-height: 1.3;
  }

  .line.title {
    font-size: clamp(2rem, 7vw, 4rem);
    margin-bottom: clamp(0.5rem, 2vh, 1rem);
  }

  .line.zh {
    font-size: clamp(1.05rem, 2.6vw, 1.35rem);

  .line.en {
    font-size: clamp(1.6rem, 4.0vw, 2.0rem);

  }

    margin-top: clamp(0.5rem, 2vh, 1rem);

  }

    display: inline-block;
    margin: 0 0.25em;
    color: #e63946;

<body>
  <div class="poem">

    <div class="line zh">这个世界上很多概念是应该清晰的，不应该被模糊的</div>
    <div class="line zh">事情是一回事，事情的动机是一回事，事情造成的结果是另一回事，事情对人造成的情绪是另一回事</div>
    <div class="line zh">我的错误是一回事，我的动机是一回事，我的错误造成的情绪是另一回事</div>
    <div class="line zh">逻辑是逻辑，情绪是情绪</div>
    <div class="line zh">意识到错误是一回事，表达歉意是一回事，修复错误酿成的情绪是另一回事</div>
    <div class="line zh">一个失误，不能只因为“没有恶意”，就认为它没有伤害。</div>
    <div class="line zh">“把事情说清楚 不等于 问题得到解决”</div>
    <div class="line zh">理性解决理性问题，感性解决情绪问题</div>
    <div class="line zh">我用逻辑辩论代替了共情，我缺失了共情</div>
    <div class="line zh">只有双方在同一频道，说同一种语言才能对话</div>
    <div class="line zh">否则就是互相鸡同鸭讲</div>
    <div class="line zh">最终将演变成情绪对轰</div>

  </div>
