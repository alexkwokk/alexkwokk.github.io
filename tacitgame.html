<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff8f5">
<title>默契挑战</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #ffd6e7 0%, #ffe9d6 100%);
    min-height: 100vh;
    color: #333;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    max-width: 720px;
    margin: 0 auto;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    color: #b0506a;
    letter-spacing: 0.05em;
  }

  .role-box {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #6c5858;
  }

  .role-pill {
    padding: 6px 14px;
    background: #fff;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(176, 80, 106, 0.12);
    font-weight: 600;
    color: #b0506a;
    font-size: 12px;
    letter-spacing: 0.05em;
  }

  .role-btn {
    background: transparent;
    border: 1px solid rgba(176, 80, 106, 0.3);
    color: #b0506a;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .role-btn:hover { background: rgba(255,255,255,0.6); }

  /* 角色选择卡片 */
  .role-card {
    max-width: 560px;
    margin: 60px auto;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(255, 105, 180, 0.15);
    padding: 40px 32px;
    text-align: center;
  }

  .role-card h2 {
    font-size: 24px;
    color: #b0506a;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .role-card p {
    color: #888;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 28px;
  }

  .role-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .role-option {
    padding: 22px 18px;
    border-radius: 16px;
    border: 2px solid #f3d8e2;
    background: #fff8fa;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .role-option:hover {
    border-color: #ff8aab;
    background: #fff;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255,138,171,0.15);
  }

  .role-option .label {
    font-size: 18px;
    font-weight: 700;
    color: #b0506a;
    margin-bottom: 6px;
  }

  .role-option .hint {
    font-size: 12px;
    color: #999;
    letter-spacing: 0.05em;
  }

  /* Tab 栏 */
  .tabs {
    display: flex;
    max-width: 720px;
    margin: 0 auto 24px;
    padding: 0 24px;
    gap: 8px;
  }

  .tab {
    flex: 1;
    padding: 12px 8px;
    background: rgba(255,255,255,0.55);
    border-radius: 14px;
    cursor: pointer;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #8a6a72;
    letter-spacing: 0.05em;
    border: 1px solid transparent;
    transition: all 0.2s;
    position: relative;
  }

  .tab.active {
    background: #fff;
    color: #b0506a;
    border-color: rgba(176, 80, 106, 0.25);
    box-shadow: 0 6px 18px rgba(176, 80, 106, 0.12);
  }

  .tab .progress {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    color: #b89aa4;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .tab.active .progress { color: #d68aa0; }

  /* Tab 内容容器 */
  .content {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 60px;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* 题目卡片 */
  .qcard {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 12px 36px rgba(255, 105, 180, 0.12);
    padding: 30px 28px 26px;
    margin-bottom: 16px;
  }

  .qhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .qidx {
    font-size: 12px;
    color: #c8909c;
    letter-spacing: 0.12em;
    font-weight: 600;
  }

  .qprogress-bar {
    width: 80px;
    height: 4px;
    background: #f7e1eb;
    border-radius: 2px;
    overflow: hidden;
  }

  .qprogress-bar > span {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #ff8aab, #ffaa6f);
    width: 0;
    transition: width 0.3s;
  }

  .qtext {
    font-size: 17px;
    line-height: 1.7;
    color: #3a2a30;
    margin-bottom: 22px;
    min-height: 56px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .opt {
    position: relative;
    padding: 12px 14px 12px 40px;
    background: #fff7fa;
    border: 2px solid #f3d8e2;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    color: #5a4046;
    line-height: 1.5;
    text-align: left;
  }

  .opt::before {
    content: attr(data-letter);
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    border: 1.5px solid #f3d8e2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #b0506a;
    font-size: 12px;
  }

  .opt:hover {
    border-color: #ff8aab;
    background: #fff;
    transform: translateY(-1px);
  }

  .opt.selected {
    border-color: #ff6f95;
    background: linear-gradient(135deg, #fff0f5, #ffe9d6);
    color: #3a2a30;
    font-weight: 600;
  }

  .opt.selected::before {
    background: linear-gradient(135deg, #ff6fa1, #ff8c69);
    color: #fff;
    border-color: transparent;
  }

  /* 挑战模式：选项即时反馈 */
  .opt.locked { cursor: default; }
  .opt.locked:hover { transform: none; border-color: #f3d8e2; background: #fff7fa; }

  .opt.correct {
    border-color: #4caf80;
    background: linear-gradient(135deg, #e6f7ee, #d8f0e3);
    color: #2c5d44;
    font-weight: 600;
    animation: correctPop 0.5s ease;
  }
  .opt.correct::before {
    background: linear-gradient(135deg, #4caf80, #6dd09a);
    color: #fff;
    border-color: transparent;
  }

  .opt.wrong {
    border-color: #e07a8a;
    background: linear-gradient(135deg, #fdecef, #fbdbe2);
    color: #6a2a36;
    font-weight: 600;
    animation: wrongShake 0.4s ease;
  }
  .opt.wrong::before {
    background: linear-gradient(135deg, #e07a8a, #f0a0ac);
    color: #fff;
    border-color: transparent;
  }

  @keyframes correctPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-6px); }
    40%      { transform: translateX(6px); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX(4px); }
  }

  /* 反馈条 */
  .feedback {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    line-height: 1.5;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct {
    background: linear-gradient(135deg, #e6f7ee, #d8f0e3);
    color: #2c5d44;
  }
  .feedback.wrong {
    background: linear-gradient(135deg, #fdecef, #fbdbe2);
    color: #6a2a36;
  }

  /* 挑战模式得分条 */
  .score-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(135deg, #fff, #fff7fa);
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(176, 80, 106, 0.08);
    margin-bottom: 14px;
    font-size: 13px;
    color: #8a6a72;
  }
  .score-bar .big {
    font-size: 22px;
    font-weight: 700;
    color: #b0506a;
    letter-spacing: 0.04em;
  }
  .score-bar .big small {
    font-size: 12px;
    color: #b89aa4;
    font-weight: 500;
    margin-left: 4px;
  }

  /* 分享 / 导入 区块 */
  .share-card {
    background: #fff;
    border-radius: 16px;
    padding: 18px 16px;
    box-shadow: 0 6px 18px rgba(176, 80, 106, 0.08);
    margin-bottom: 14px;
  }
  .share-card h4 {
    font-size: 14px;
    color: #b0506a;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .share-card p {
    font-size: 12px;
    color: #8a6a72;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .share-row {
    display: flex;
    gap: 8px;
  }
  .share-input {
    flex: 1;
    padding: 10px 12px;
    border: 1.5px solid #f3d8e2;
    border-radius: 10px;
    font-size: 12px;
    color: #5a4046;
    background: #fff7fa;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    letter-spacing: 0.04em;
    min-width: 0;
  }
  .share-input:focus { outline: none; border-color: #ff8aab; background: #fff; }
  .share-btn {
    padding: 10px 16px;
    background: linear-gradient(135deg, #ff6fa1, #ff8c69);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .share-btn:hover { opacity: 0.92; }
  .share-btn.ghost {
    background: #fff;
    color: #b0506a;
    border: 1.5px solid #f3d8e2;
  }
  .share-btn.ghost:hover { border-color: #ff8aab; background: #fff7fa; }
  .share-card .status {
    margin-top: 8px;
    font-size: 12px;
    color: #4caf80;
    min-height: 16px;
  }

  /* 同步状态条 */
  .sync-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    max-width: 720px;
    margin: 0 auto 14px;
    padding: 0 24px;
  }
  .sync-bar .sync-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(176, 80, 106, 0.12);
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(176, 80, 106, 0.06);
  }
  .sync-bar .sync-actions {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sync-bar .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
  }
  .sync-bar .status-dot.online { background: #4caf80; box-shadow: 0 0 0 3px rgba(76, 175, 128, 0.2); }
  .sync-bar .status-dot.err    { background: #e07a8a; }
  .sync-bar .status-text {
    font-size: 12px;
    color: #8a6a72;
    line-height: 1;
  }
  .sync-bar .status-text.online { color: #4caf80; }
  .sync-bar .status-text.err    { color: #e07a8a; }
  .sync-bar .icon-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    color: #b0506a;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(176, 80, 106, 0.12);
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
  }
  .sync-bar .icon-btn:hover {
    background: #fff;
    border-color: rgba(176, 80, 106, 0.3);
  }
  .sync-bar .icon-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* 导航按钮 */
  .nav-row {
    display: flex;
    gap: 12px;
    margin-top: 18px;
  }

  .nav-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .nav-btn.primary {
    background: linear-gradient(135deg, #ff6fa1, #ff8c69);
    color: #fff;
    box-shadow: 0 6px 18px rgba(255, 111, 161, 0.32);
  }

  .nav-btn.primary:hover { transform: translateY(-1px); }
  .nav-btn.primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .nav-btn.ghost {
    background: #fff;
    color: #b0506a;
    border: 1.5px solid #f3d8e2;
  }

  .nav-btn.ghost:hover { border-color: #ff8aab; }

  /* 结果面板 */
  .result-summary {
    background: linear-gradient(135deg, #fff, #fff7fa);
    border-radius: 24px;
    padding: 30px 24px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: 0 12px 36px rgba(255, 105, 180, 0.12);
  }

  .result-summary .emoji {
    font-size: 36px;
    margin-bottom: 10px;
  }

  .result-summary .score {
    font-size: 42px;
    font-weight: 700;
    color: #b0506a;
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .result-summary .score-sub {
    font-size: 14px;
    color: #9c7a82;
    margin: 8px 0 4px;
    letter-spacing: 0.04em;
  }

  .result-summary .verdict {
    font-size: 14px;
    color: #5a4046;
    line-height: 1.6;
    margin-top: 14px;
  }

  .result-list {
    display: grid;
    gap: 10px;
  }

  .result-item {
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 4px 14px rgba(176, 80, 106, 0.07);
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 12px;
    align-items: start;
    border-left: 4px solid #f3d8e2;
  }

  .result-item.match { border-left-color: #ff8aab; background: #fffafb; }
  .result-item.miss  { border-left-color: #d8c8be; }

  .result-item .mark {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
  }

  .result-item.match .mark { background: linear-gradient(135deg, #ff6fa1, #ff8c69); }
  .result-item.miss .mark  { background: #c8b3a8; }

  .result-item .body { min-width: 0; }

  .result-item .qtitle {
    font-size: 13px;
    color: #5a4046;
    margin-bottom: 6px;
    line-height: 1.5;
  }

  .result-item .choices {
    display: grid;
    gap: 4px;
    font-size: 12px;
    color: #8a6a72;
  }

  .result-item .choices .row {
    display: grid;
    grid-template-columns: 70px 1fr;
    align-items: start;
    gap: 8px;
    line-height: 1.5;
  }

  .result-item .choices .who {
    color: #b0506a;
    font-weight: 600;
    text-align: right;
  }

  .empty-tip {
    background: #fff;
    border-radius: 16px;
    padding: 30px 24px;
    text-align: center;
    color: #8a6a72;
    font-size: 14px;
    line-height: 1.7;
    box-shadow: 0 4px 14px rgba(176, 80, 106, 0.07);
  }

  /* 返回首页 */
  .home-link {
    display: block;
    text-align: center;
    margin: 28px auto;
    color: #b0506a;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  .home-link:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .options { grid-template-columns: 1fr; }
    .role-options { grid-template-columns: 1fr; }
    .topbar { padding: 14px 16px; }
    .tabs { padding: 0 16px; }
    .content { padding: 0 16px 60px; }
  }
</style>
</head>

<div class="topbar" id="topbar">
  <div class="logo">默契挑战</div>
  <div class="role-box" id="roleBox"></div>
</div>

<div id="entryArea">
  <!-- 静态骨架：即使 JS 完全没跑，也至少显示一张卡（避免出现纯空白页面） -->
  <noscript>
    <div class="role-card"><h2>需要启用 JavaScript</h2><p>请在浏览器中启用 JavaScript 后刷新本页面。</p></div>
  </noscript>
  <div class="role-card" id="entrySkeleton">
    <h2>默契挑战</h2>
    <p style="margin-bottom:18px;">正在加载…请稍候。<br>如果长时间停留，请按 <b>Ctrl/Cmd + Shift + R</b> 强制刷新。</p>
    <div class="role-options" aria-hidden="true">
      <div class="role-option" style="opacity:.55;cursor:default"><div class="label">ggh</div><div class="hint">A 玩家</div></div>
      <div class="role-option" style="opacity:.55;cursor:default"><div class="label">hsq</div><div class="hint">B 玩家</div></div>
    </div>
  </div>
</div>

<div id="mainArea" style="display:none;">
  <div class="sync-bar" id="syncBar">
    <div class="sync-status-pill">
      <span class="status-dot" id="syncDot"></span>
      <span class="status-text" id="syncStatus">未连接</span>
    </div>
    <div class="sync-actions">
      <button id="syncRefreshBtn" class="icon-btn">↻ 刷新</button>
      <button id="diagnoseBtn" class="icon-btn">🔍 诊断</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="setup">设置答案<span class="progress" id="progSetup"></span></div>
    <div class="tab" data-tab="challenge">挑战对方<span class="progress" id="progChallenge"></span></div>
    <div class="tab" data-tab="result">默契结果</div>
  </div>

  <div class="content">
    <!-- Tab 1：设置自己的答案 -->
    <div class="panel active" id="panel-setup"></div>

    <!-- Tab 2：挑战对方 -->
    <div class="panel" id="panel-challenge"></div>

    <!-- Tab 3：结果 -->
    <div class="panel" id="panel-result"></div>
  </div>
</div>

<a class="home-link" href="index.html">← 返回首页</a>

<script>
'use strict';

let QUESTIONS = [];

/* ---------- 工具：本地存储 ---------- */
const storage = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v == null ? fallback : JSON.parse(v);
    } catch (_) { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch (_) {}
  }
};

/* ---------- 角色相关 key ---------- */
function myAnswersKey(role)  { return 'tacit_' + role + '_answers'; }
function myGuessKey(role)    { return 'tacit_' + role + '_guess'; }
function partnerRole(role)   { return role === 'a' ? 'b' : 'a'; }
function partnerNameOf(role) { return role === 'a' ? 'hsq' : 'ggh'; }
function myNameOf(role)      { return role === 'a' ? 'ggh' : 'hsq'; }

/* ---------- Supabase 客户端（异步初始化；未就绪时优雅降级）---------- */
const SUPABASE_URL = 'https://vkbigxnktcfxqgdatbxl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4Ur_2FA35wepbQKqwv3ImQ_Gx8dcf-n';
const ROOM_CODE = 'tacit_default'; // 全宇宙就一对
let supabase = null;
let supabaseReady = false;
let supabaseInitialized = false; // 防止重复 createClient（每次调用都会破坏 realtime 状态）
function tryInitSupabase() {
  // 幂等保护：DOMContentLoaded 和 window.load 都会触发本函数，
  // 重复 createClient 会导致旧的 realtime channel 指向被丢弃的 client、
  // 在后续 .from() 调用时触发 `Cannot read properties of null (reading 'orgUrl')`。
  if (supabaseInitialized) return;
  console.log('[supabase] tryInitSupabase called; SDK ready?', !!(window.supabase && window.supabase.createClient));
  try {
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      supabaseReady = true;
      supabaseInitialized = true;
      console.log('[supabase] initialized, URL = ' + SUPABASE_URL);
      if (storage.get('tacit_role')) {
        syncNow();
        subscribePartner();
      }
    } else {
      console.warn('[supabase] SDK 仍未就绪');
    }
  } catch (e) {
    console.warn('[supabase] 初始化失败：', e && e.message, e && e.stack);
  }
}

// 实时订阅：对方答案发生变化时立刻同步（替代旧的定时轮询）
let partnerChannel = null;
function cleanupPartnerChannel() {
  if (!partnerChannel) return;
  try {
    if (supabase && typeof supabase.removeChannel === 'function') {
      supabase.removeChannel(partnerChannel);
    }
  } catch (e) {
    console.warn('[realtime] removeChannel failed:', e && e.message);
  }
  partnerChannel = null;
}
function subscribePartner() {
  if (!supabaseReady || !supabase) return;
  if (partnerChannel) return;
  try {
    partnerChannel = supabase
      .channel('tacit_pair_' + ROOM_CODE)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'tacit_answers', filter: 'room_code=eq.' + ROOM_CODE },
        (payload) => {
          console.log('[realtime] partner changed:', payload);
          syncNow();
        })
      .subscribe((status) => {
        console.log('[realtime] channel status =', status);
      });
  } catch (e) {
    console.warn('[realtime] subscribe failed:', e && e.message);
    partnerChannel = null;
  }
}

/* ---------- 工具：上传 / 拉取答案（key 固定 room_code = 'tacit_default'）---------- */
async function uploadAnswers(role, answers) {
  if (!supabaseReady || !supabase || typeof supabase.from !== 'function') return { ok: false, error: 'no supabase' };
  try {
    const { data, error } = await supabase
      .from('tacit_answers')
      .upsert({ room_code: ROOM_CODE, role, answers },
              { onConflict: 'room_code,role' })
      .select();
    if (error) { console.error('[upload] supabase error:', error); return { ok: false, error: error.message }; }
    console.log('[upload] ok role=' + role, data);
    return { ok: true };
  } catch (e) {
    console.error('[upload] throw:', e);
    return { ok: false, error: (e && e.message) || 'upload failed' };
  }
}

async function fetchPairAnswers() {
  if (!supabaseReady || !supabase || typeof supabase.from !== 'function') return [];
  try {
    const { data, error } = await supabase
      .from('tacit_answers')
      .select('role,answers')
      .eq('room_code', ROOM_CODE);
    if (error) { console.error('[fetch] supabase error:', error); return []; }
    console.log('[fetch] rows count=' + (data ? data.length : 0), data);
    return data || [];
  } catch (e) {
    console.error('[fetch] throw:', e);
    return [];
  }
}

  lines.push('window.supabase = ' + !!window.supabase);
  lines.push('supabaseReady = ' + supabaseReady);
  lines.push('ROOM_CODE = ' + ROOM_CODE);
  lines.push('supabase.from exists = ' + !!(supabase && supabase.from));

  try {
    const { data, error, status } = await supabase
      .from('tacit_answers')
      .select('role')
      .eq('room_code', ROOM_CODE);

function setSyncStatus(state, text) {
  const dot = document.getElementById('syncDot');
  const ss  = document.getElementById('syncStatus');
  if (!dot || !ss) return;
  dot.classList.remove('online', 'err');
  ss.classList.remove('online', 'err');
  if (state === 'online') {
    dot.classList.add('online');
    ss.classList.add('online');
    ss.textContent = text || '已连接';
  } else if (state === 'err') {
    dot.classList.add('err');
    ss.classList.add('err');
    ss.textContent = text || '连接失败';
  } else {
    ss.textContent = text || '未连接';
  }
}

function bindSyncIndicator() {
  // 初始化一次状态；4 秒后如果还没真正初始化就提示
  setSyncStatus('idle', supabaseReady ? '未连接' : '连接中…');
  setTimeout(() => {
    if (!supabaseReady) {
      setSyncStatus('err', '云同步未就绪');
      console.error('[supabase] 4 秒后仍未 ready，请检查网络');
    }
  }, 4000);
  // 手动刷新按钮
  const btn = document.getElementById('syncRefreshBtn');
  if (btn && !btn.__bound) {
    btn.__bound = true;
    btn.addEventListener('click', () => {
      btn.disabled = true;
      btn.textContent = '同步中…';
      syncNow().finally(() => {
        btn.disabled = false;
        btn.textContent = '↻ 刷新';
      });
    });
  }
  // 诊断按钮
  const dbg = document.getElementById('diagnoseBtn');
  if (dbg && !dbg.__bound) {
    dbg.__bound = true;
    dbg.addEventListener('click', () => {
      if (!supabaseReady) {
        alert('Supabase SDK 还没准备好，等几秒再试');
        return;
      }
      diagnose();
    });
  }
}

/* 同步：把本地答案推到云端，并拉取对方答案 */
async function syncNow() {
  const role = storage.get('tacit_role');
  if (!role) return;
  if (!supabaseReady) {
    setSyncStatus('idle', '连接中…');
    return;
  }
  if (!supabase || typeof supabase.from !== 'function') {
    // 客户端尚未初始化或状态异常；不要抛错，直接跳过
    return;
  }

  const myAns = storage.get(myAnswersKey(role), {});
  if (Object.keys(myAns).length > 0) {
    setSyncStatus('idle', '上传中…');
    const r = await uploadAnswers(role, myAns);
    if (!r.ok) {
      // 上传失败时保留旧 partner，不要清空（避免网络抖动把 UI 退回等待）
      setSyncStatus('err', '上传失败: ' + r.error);
      return;
    }
  }

  const rows = await fetchPairAnswers();
  const partnerKey = partnerRole(role);
  const partnerRow = rows.find(r => r.role === partnerKey);

  // 解析 answers：PostgREST 返回的 jsonb 字段已经是对象；但容错一下字符串
  const partnerAnswers = partnerRow && partnerRow.answers
    ? (typeof partnerRow.answers === 'string' ? safeParse(partnerRow.answers) : partnerRow.answers)
    : null;

  if (partnerAnswers && Object.keys(partnerAnswers).length > 0) {
    storage.set('tacit_partner', partnerAnswers);
    const partnerName = partnerNameOf(role);
    setSyncStatus('online', `${partnerName} 已就绪 ✓`);
  } else {
    // 拉取不到时**不**清空旧 partner（避免 UI 来回跳）
    const old = storage.get('tacit_partner', null);
    if (old && Object.keys(old).length > 0) {
      setSyncStatus('online', `${partnerNameOf(role)} 已就绪 ✓（缓存）`);
    } else {
      storage.remove('tacit_partner');
      setSyncStatus('idle', `等待 ${partnerNameOf(role)} 答完题目…`);
    }
  }

  if (typeof currentTab !== 'undefined') {
    if (currentTab === 'setup')     renderSetupPanel(role);
    if (currentTab === 'challenge') renderChallengePanel(role);
    if (currentTab === 'result')    renderResultPanel(role);
  }
  if (typeof updateTabProgress === 'function') updateTabProgress();
}

function safeParse(s) {
  try { return JSON.parse(s); } catch (_) { return null; }
}

function parseQuestionsText(text) {
  return text
    .split('\n')
    .map(line => line.trim())
    .filter(line => line && /^\d+\./.test(line))
    .map((line, i) => {
      const m = line.match(/^(\d+)\.\s*(.+)$/);
      if (!m) return null;
      const id = parseInt(m[1], 10);
      const parts = m[2].split('|').map(p => p.trim());
      if (parts.length < 5) return null;
      return { id, text: parts[0], options: parts.slice(1, 5) };
    })
    .filter(Boolean);
}

async function loadQuestions() {
  // 直接使用内嵌题库（不再 fetch，避免 file:// / 路径 / 网络 任何问题）
  const text = EMBEDDED_QUESTIONS;
  QUESTIONS = parseQuestionsText(text);
  if (QUESTIONS.length === 0) {
    throw new Error('内嵌题库为空（' + text.length + ' 字符）');
  }
}

let currentTab = 'setup';
let activeQid = 0; // 当前题号（用于 setup & challenge 两 Tab）

function initMain() {
  bindTabs();
  bindSyncIndicator();
  renderPanel('setup');
  renderPanel('challenge');
  renderPanel('result');
  updateTabProgress();
  startPolling();
  // 同步由 tryInitSupabase / switchTab / 答题回调触发；此处不重复触发

function bindTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      const tab = t.getAttribute('data-tab');
      switchTab(tab);
    });
  });
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.getAttribute('data-tab') === tab);
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel-' + tab);
  });
  if (tab === 'setup')     renderPanel('setup');
  if (tab === 'challenge') renderPanel('challenge');
  if (tab === 'result')    renderPanel('result');
  // 切到挑战/结果 Tab 时主动拉取一次对方答案，避免错过对方刚答完的情况
  if (tab === 'challenge' || tab === 'result') {
    syncNow();
  }
}

/* ---------- Setup session（一轮 = 从未设置答案的题中随机抽 30 道）---------- */
const SETUP_SESSION_KEY = 'tacit_setup_session';
const QUESTIONS_PER_SETUP = 30;

function loadSetupSession() {
  const s = storage.get(SETUP_SESSION_KEY, null);
  if (!s || !Array.isArray(s.pickedIds)) return { pickedIds: [], activeIndex: 0 };
  if (typeof s.activeIndex !== 'number') s.activeIndex = 0;
  return s;
}
function saveSetupSession(s) { storage.set(SETUP_SESSION_KEY, s); }

function pickFreshSetupBatch(role, n) {
  const stored = storage.get(myAnswersKey(role), {});
  const answeredSet = new Set(Object.keys(stored).map(k => Number(k)));
  const pool = QUESTIONS
    .map(q => q.id)
    .filter(id => !answeredSet.has(id));
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, n);
}

function startNewSetupSession(role) {
  const picked = pickFreshSetupBatch(role, QUESTIONS_PER_SETUP);
  saveSetupSession({ pickedIds: picked, activeIndex: 0 });
  return loadSetupSession();
}

function ensureSetupSession(role) {
  let s = loadSetupSession();
  s.pickedIds = s.pickedIds.filter(id => QUESTIONS.some(q => q.id === id));
  if (s.pickedIds.length === 0) {
    s = startNewSetupSession(role);
  } else {
    saveSetupSession(s);
  }
  return s;
}

async function resetSetupAnswers(role) {

function renderSetupPanel(role) {
  const panel = document.getElementById('panel-setup');
  const stored = storage.get(myAnswersKey(role), {});
  const totalDone = Object.keys(stored).length;
  const totalAll = QUESTIONS.length;

  // 全部完成 → 显示完成态

    panel.innerHTML = `

  }

  const session = ensureSetupSession(role);
  const batchTotal = session.pickedIds.length;

  // 题目全部抽完了（说明没有未答的题了）
  if (batchTotal === 0) {

      </div>
      <div class="nav-row" style="margin-top:18px;">
        <button class="nav-btn ghost" id="resetSetupBtn">清空并重新设置</button>
      </div>
    `;
    const resetBtn = panel.querySelector('#resetSetupBtn');
    if (resetBtn) resetBtn.addEventListener('click', () => resetSetupAnswers(role));
    return;
  }

  // 计算本轮进度
  const doneInBatch = session.pickedIds.reduce((acc, id) => acc + (stored[id] ? 1 : 0), 0);

  // 把 activeQid 锁定在本轮范围内；不去自动跳到未答题，
  // 这样用户可以自由地"上一题"回去修改已答的题
  if (typeof activeQid !== 'number' || activeQid < 0 || activeQid >= batchTotal) {
    // 仅在越界时回到最早的未答题；正常范围内保留 activeQid
    const firstUn = session.pickedIds.findIndex(id => !stored[id]);
    activeQid = firstUn >= 0 ? firstUn : 0;
  }

  const currentId = session.pickedIds[activeQid];
  const q = QUESTIONS.find(x => x.id === currentId) || QUESTIONS[0];
  const isLast = activeQid === batchTotal - 1;
  const allDoneInBatch = doneInBatch >= batchTotal;

  panel.innerHTML = buildSetupTopBar(doneInBatch, batchTotal, totalDone, totalAll);

  // 本轮全部答完 → 显示提交按钮
  if (allDoneInBatch) {

        🎉 本轮 <b>${batchTotal}</b> 道题已全部设置答案！<br>
        点击下方「提交全部答案」按钮上传到服务器。
      </div>

  }

  panel.innerHTML += buildSetupQCard(q, activeQid, stored[q.id], batchTotal);

  // 绑定答题选项事件
  bindSetupCardEvents(panel, q, role, stored);

  // 底部：提交按钮 + 清空入口

  bottomBar.innerHTML = `

    submitBtn.addEventListener('click', async () => {
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中…';
      await syncNow();
      submitBtn.textContent = '已提交 ✓';
      submitBtn.style.background = '#4caf80';
      setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = '提交全部答案';
        submitBtn.style.background = '';
        storage.remove(SETUP_SESSION_KEY);
        renderSetupPanel(role);

const QUESTIONS_PER_CHALLENGE = 30; // 每次挑战从全部题库中随机挑选的题数

/* ---------- 挑战 session（一轮 = 从对方已答的题中随机抽 ≤30 道，不重复已猜过的）---------- */
const SESSION_KEY = 'tacit_challenge_session'; // { pickedIds:[...], activeIndex:0 }
function loadSession() {
  const s = storage.get(SESSION_KEY, null);
  if (!s || !Array.isArray(s.pickedIds)) return { pickedIds: [], activeIndex: 0 };
  if (typeof s.activeIndex !== 'number') s.activeIndex = 0;
  return s;
}
function saveSession(s) { storage.set(SESSION_KEY, s); }

// 从对方已答的题中，随机抽最多 n 道"未猜过"的题
// partner: 对方 answers 对象（key 为题号字符串）
function pickFreshBatchFromPartner(partner, myGuess, n) {
  if (!partner) return [];
  const guessSet = new Set(Object.keys(myGuess).map(k => Number(k)));
  const pool = Object.keys(partner)
    .map(id => Number(id))
    .filter(id => !guessSet.has(id) && QUESTIONS.some(q => q.id === id));
  // Fisher-Yates 洗牌
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, n);
}

// 开启新的一轮：从对方已答的题中抽 ≤30 道未猜过的
// 若对方一道都没答，或已全部猜完，pickedIds 为空（由调用方展示提示）
function startNewChallengeSession(role, partner) {
  const myGuess = storage.get(myGuessKey(role), {});
  const picked = pickFreshBatchFromPartner(partner, myGuess, QUESTIONS_PER_CHALLENGE);
  saveSession({ pickedIds: picked, activeIndex: 0 });
  return loadSession();
}

// 确保 session 有效：清理已不存在的题号；本轮答完时自动开下一轮（从最新 partner 数据）
function ensureChallengeSession(role, partner) {
  let s = loadSession();
  s.pickedIds = s.pickedIds.filter(id => QUESTIONS.some(q => q.id === id));
  const myGuess = storage.get(myGuessKey(role), {});
  const allAnswered = s.pickedIds.length > 0 && s.pickedIds.every(id => !!myGuess[id]);
  if (s.pickedIds.length === 0 || allAnswered) {
    s = startNewChallengeSession(role, partner);
  } else {
    saveSession(s);
  }
  return s;
}

  });

  panel.querySelector('#nextBtn').addEventListener('click', () => {
    const cur = storage.get(storeKey, {});

      if (fb) { fb.className = 'feedback show'; fb.textContent = '请先选择一个答案'; }
      return;
    }
    if (isChallenge) {
      // 在本轮 session.pickedIds 内翻面；都答完就回到 0 方便回看
      const sess = loadSession();
      const ids  = sess.pickedIds;
      const total = ids.length;
      if (total === 0) { renderChallengePanel(role); return; }
      const done = storage.get(storeKey, {});
      let next = -1;
      for (let i = activeQid + 1; i < total; i++) {
        if (!done[ids[i]]) { next = i; break; }
      }
      if (next < 0) {
        for (let i = 0; i < total; i++) {
          if (!done[ids[i]]) { next = i; break; }
        }
        if (next < 0) next = 0;
      }
      activeQid = next;
      renderChallengePanel(role);
    } else {
      const done2 = storage.get(myAnswersKey(role), {});
      const doneCount = Object.keys(done2).length;
      if (doneCount >= QUESTIONS.length) {
        renderSetupPanel(role);
        // 已答完全部题目，立即触发一次同步
        syncNow();
      } else {
        for (let i = activeQid + 1; i < QUESTIONS.length; i++) {
          if (!done2[QUESTIONS[i].id]) { activeQid = i; break; }
        }
        renderSetupPanel(role);
      }
    }
  });
}

/* ---------- Challenge Tab：猜对方的答案（从对方已答的题中随机抽 ≤30 道，不重复已猜过的）---------- */
async function resetChallengeAnswers(role) {
  if (!confirm('确定要清空你所有的"猜"吗？\n\n只会清空本地的猜测记录，不会影响对方已答的题目。')) return;
  storage.remove(myGuessKey(role));
  storage.remove(SESSION_KEY);
  const partner = storage.get('tacit_partner', null);

  activeQid = 0;
  renderChallengePanel(role);
  updateTabProgress();
}

function renderChallengePanel(role) {
  const panel = document.getElementById('panel-challenge');
  const stored = storage.get(myGuessKey(role), {});       // 我的猜测
  const partner = storage.get('tacit_partner', null);    // 对方的答案

  const partnerTotal = partner ? Object.keys(partner).length : 0;

  // 对方一道都没答 → 直接展示等待态
  if (!partner || partnerTotal === 0) {
    panel.innerHTML = buildChallengeTopBar(role, null, 0, 0, 0, 0);
    panel.innerHTML += `
      <div class="empty-tip">
        ⏳ 等待 ${partnerNameOf(role)} 先去「设置答案」Tab 答几道题。<br>
        ta 每答一道，这里就可能出现一道待猜的题。
      </div>
    `;
    panel.dataset.ready = '0';
    return;
  }

  const session = ensureChallengeSession(role, partner);
  const roundTotal = session.pickedIds.length;

  // 已全部猜完（对方有题，但我的 session 里没有未猜的了）
  if (roundTotal === 0) {
    const totalGuessed = Object.keys(stored).length;
    const score = calcChallengeScore(role);
    panel.innerHTML = buildChallengeTopBar(role, partner, score, roundTotal, roundTotal, partnerTotal);
    panel.innerHTML += `
      <div class="empty-tip" style="background:linear-gradient(135deg,#e6f7ee,#d8f0e3);color:#2c5d44;">
        🎉 太棒了！对方已答的 <b>${partnerTotal}</b> 道题你已经全部猜完啦！<br>
        共猜对 <b>${score}</b> 道，继续去刷新看看对方有没有新增答案吧 💪
      </div>
      <div class="nav-row" style="margin-top:14px;">
        <button class="nav-btn ghost" id="resetChallengeBtn" style="font-size:13px;color:#8a6a72;border-color:#eee;">清空猜测，重新开始</button>
      </div>
    `;
    const resetBtn = panel.querySelector('#resetChallengeBtn');
    if (resetBtn) resetBtn.addEventListener('click', () => resetChallengeAnswers(role));
    return;
  }

  // 计算本轮进度
  const doneInRound = session.pickedIds.reduce((acc, id) => acc + (stored[id] ? 1 : 0), 0);
  const score = calcChallengeScore(role);

  // 把 activeQid 锁定在本轮范围内，并自动跳到最早的未答题
  if (typeof activeQid !== 'number' || activeQid < 0 || activeQid >= roundTotal) {
    activeQid = 0;
  }
  const curId = session.pickedIds[activeQid];
  if (curId && stored[curId]) {
    const firstUn = session.pickedIds.findIndex(id => !stored[id]);
    if (firstUn >= 0) activeQid = firstUn;
  }

  const currentId = session.pickedIds[activeQid];
  const q = QUESTIONS.find(x => x.id === currentId) || QUESTIONS[0];
  const inRoundIdx = activeQid;
  const allDoneInRound = doneInRound >= roundTotal;

  let topHtml = buildChallengeTopBar(role, partner, score, doneInRound, roundTotal, partnerTotal);

  // 全部答完本轮 → 提示可刷新获取更多
  if (allDoneInRound) {
    topHtml += `
      <div class="empty-tip" style="background:linear-gradient(135deg,#fff0f5,#ffe9d6);color:#6a2a36;margin-bottom:12px;">
        🎉 本轮 <b>${roundTotal}</b> 道题全部猜完！<br>
        共猜对 <b>${score}</b> 道。<br>
        对方还有 <b>${partnerTotal - totalGuessed}</b> 道题未挑战，点击「刷新题目」获取下一批。
      </div>
    `;
  }

  panel.innerHTML = topHtml;
  panel.dataset.ready = '1';
  panel.innerHTML += buildQCard(q, inRoundIdx, stored[q.id], true, role, roundTotal);

  // 已答题 → 展示判分结果
  const userLetter = stored[q.id];
  if (userLetter) {
    const fb = panel.querySelector('#fb');
    const partnerLetter = partner ? partner[q.id] : null;
    if (partnerLetter) {
      const isMatch = userLetter === partnerLetter;
      fb.className = `feedback show ${isMatch ? 'correct' : 'wrong'}`;
      fb.textContent = isMatch ? '太棒了！猜对了！' : `不对哦，ta 的答案是 ${partnerLetter}。`;
      panel.querySelectorAll('.opt').forEach(o => {
        o.classList.add('locked');
        o.classList.remove('selected');
      });
      const userOpt = panel.querySelector(`.opt[data-letter="${userLetter}"]`);
      if (userOpt) {
        userOpt.classList.add('selected');
        userOpt.classList.add(isMatch ? 'correct' : 'wrong');
      }
      const correctOpt = panel.querySelector(`.opt[data-letter="${partnerLetter}"]`);
      if (correctOpt) correctOpt.classList.add('correct');
    } else {
      fb.className = 'feedback show';
      fb.textContent = '已保存 ✓（等对方答完即可判分）';
      panel.querySelectorAll('.opt').forEach(o => o.classList.add('locked'));
      const userOpt = panel.querySelector(`.opt[data-letter="${userLetter}"]`);
      if (userOpt) userOpt.classList.add('selected');
    }
  }

  // 绑定"刷新题目"（手动从最新 partner 重新抽一批）
  if (allDoneInRound) {
    const refreshBtn = panel.querySelector('#nextBatchBtn') || document.createElement('div');
    if (!panel.querySelector('#nextBatchBtn')) {
      const btnRow = document.createElement('div');
      btnRow.className = 'nav-row';
      btnRow.style.marginBottom = '14px';
      btnRow.innerHTML = `<button class="nav-btn primary" id="nextBatchBtn">🔄 刷新题目（抽下一批）</button>`;
      panel.insertBefore(btnRow, panel.querySelector('.qcard'));
    }
    const rb = panel.querySelector('#nextBatchBtn');
    rb.addEventListener('click', () => {
      startNewChallengeSession(role, partner);
      activeQid = 0;
      renderChallengePanel(role);
    });
  } else {
    // 未答完时，显示"重新抽一批"（放弃本轮进度）
    const redrawBar = document.createElement('div');
    redrawBar.className = 'nav-row';
    redrawBar.style.marginBottom = '14px';
    redrawBar.innerHTML = `
      <button class="nav-btn ghost" id="redrawBatchBtn" style="font-size:13px;">
        🎲 重新抽一批（放弃本轮进度）
      </button>
    `;
    panel.insertBefore(redrawBar, panel.querySelector('.qcard'));
    panel.querySelector('#redrawBatchBtn').addEventListener('click', () => {
      if (!confirm('重新抽一批会放弃本轮的猜测进度，确定吗？')) return;
      const old = storage.get(myGuessKey(role), {});
      session.pickedIds.forEach(id => { delete old[id]; });
      storage.set(myGuessKey(role), old);
      startNewChallengeSession(role, partner);
      activeQid = 0;
      renderChallengePanel(role);
      updateTabProgress();
    });
  }

  // 底部：清空所有猜测
  const resetBar = document.createElement('div');
  resetBar.className = 'nav-row';
  resetBar.style.marginTop = '4px';
  resetBar.innerHTML = `
    <button class="nav-btn ghost" id="resetChallengeBtn" style="font-size:13px;color:#8a6a72;border-color:#eee;">
      清空所有猜测并重新开始
    </button>
  `;
  panel.appendChild(resetBar);
  const resetBtn = panel.querySelector('#resetChallengeBtn');
  if (resetBtn) resetBtn.addEventListener('click', () => resetChallengeAnswers(role));

  bindQCardEvents(panel, q, myGuessKey(role), stored, true, role);
}

function calcChallengeScore(role) {
  const guess = storage.get(myGuessKey(role), {});
  const partner = storage.get('tacit_partner', null);
  if (!partner) return 0;
  let count = 0;
  for (const qid in guess) {
    if (guess[qid] === partner[qid]) count++;
  }
  return count;
}

function updateChallengeScore(role) {
  const bar = document.getElementById('challengeScoreBar');
  if (!bar) return;
  const guess = storage.get(myGuessKey(role), {});
  const partner = storage.get('tacit_partner', null);
  if (!partner) return;
  const session = loadSession();
  const roundTotal = session.pickedIds.length;
  const doneInRound = session.pickedIds.reduce((acc, id) => acc + (guess[id] ? 1 : 0), 0);
  const count = calcChallengeScore(role);
  bar.querySelector('.big').innerHTML = `${doneInRound}<small>/${roundTotal}</small>`;
}

/* ---------- 结果面板 ---------- */
function renderResultPanel(myRole) {
  const panel = document.getElementById('panel-result');
  const myAns   = storage.get(myAnswersKey(myRole), {});
  const myGuess = storage.get(myGuessKey(myRole), {});
  const partner = storage.get('tacit_partner', null);

  // 当 challenge 模式下导入过对方答案，按"我猜 vs 对方答案"算得分
  if (partner) {
    let total = 0, hit = 0;
    const rows = [];
    for (let i = 0; i < QUESTIONS.length; i++) {
      const q = QUESTIONS[i];
      const g = myGuess[q.id];
      const truth = partner[q.id];
      if (!g || !truth) continue;
      total++;
      const isMatch = g === truth;
      if (isMatch) hit++;
      rows.push({ q, g, truth, isMatch });
    }
    if (total === 0) {
      panel.innerHTML = `
        <div class="empty-tip">
          还没有挑战记录哦。<br>
          去 <b>「挑战对方」</b> Tab 答几道题再来查看。
        </div>
      `;
      return;
    }
    const percent = Math.round(hit / total * 100);
    let verdict = '继续加油，多聊聊会更默契 ✨';
    if (percent >= 90) verdict = '心有灵犀一点通，你们是天作之合 ❤️';
    else if (percent >= 70) verdict = '默契度很高，是懂对方的人 💕';
    else if (percent >= 50) verdict = '不错不错，对方有点被你拿捏了 😉';
    else verdict = '还有许多可探索的空间，今晚打个电话聊聊？📞';

    let emoji = '💌';
    if (percent >= 90) emoji = '💖';
    else if (percent >= 70) emoji = '💕';
    else if (percent >= 50) emoji = '🌸';
    else emoji = '🌱';

    const htmlRows = rows.map(({ q, g, truth, isMatch }) => {
      const gOpt = q.options['ABCD'.indexOf(g)];
      const tOpt = q.options['ABCD'.indexOf(truth)];
      return `
        <div class="result-item ${isMatch ? 'match' : 'miss'}">
          <div class="mark">${isMatch ? '✓' : '✗'}</div>
          <div class="body">
            <div class="qtitle">${escapeHTML(q.text)}</div>
            <div class="choices">
              <div class="row"><span class="who">你猜(${g})</span><span>${escapeHTML(gOpt)}</span></div>
              <div class="row"><span class="who">ta(${truth})</span><span>${escapeHTML(tOpt)}</span></div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    panel.innerHTML = `
      <div class="result-summary">
        <div class="emoji">${emoji}</div>
        <div class="score">${hit} / ${total}</div>
        <div class="score-sub">最终默契度 · 双方已对齐</div>
        <div class="verdict">${verdict}</div>
      </div>
      <div class="result-list">${htmlRows}</div>
    `;
    return;
  }

  // 没导入对方答案：提示用户去导入
  panel.innerHTML = `
    <div class="empty-tip">
      还在等待 ${partnerNameOf(myRole)} 完成答题。<br>
      对方答完会自动同步过来。
    </div>
  `;
}

/* ---------- 工具：HTML 转义 ---------- */
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ---------- 启动 ---------- */
function showBootError(e) {
  console.error('boot failed:', e);
  const msg = (e && (e.stack || e.message || String(e))) || 'unknown';
  const el = document.getElementById('entryArea');
  if (el) {
    el.innerHTML = `
      <div class="role-card" style="border:2px solid #e07a8a;">
        <h2>页面加载出错</h2>
        <p style="font-size:12px;color:#8a4046;margin-bottom:8px;">请按 <b>Ctrl/Cmd + Shift + R</b> 强制刷新，或把下面的错误发给开发者：</p>
        <pre style="font-size:11px;color:#5a4046;background:#fff7fa;padding:8px;border-radius:8px;overflow:auto;max-height:200px;">${escapeHTML(msg)}</pre>
      </div>
    `;
  }
}

// 全局兜底：把所有未捕获错误强制写到页面上，绝不出现"一片空白"
function __paintGlobalError(label, detail) {
  try {
    const el = document.getElementById('entryArea');
    if (!el) return;
    const stamp = (window.__errStamp = (window.__errStamp || 0) + 1);
    if (stamp > 1) return; // 只显示第一条
    const card = document.createElement('div');
    card.className = 'role-card';
    card.style.border = '2px solid #e07a8a';
    card.innerHTML = '<h2>页面加载出错 (' + label + ')</h2>'
      + '<p style="font-size:12px;color:#8a4046;margin-bottom:8px;">请按 <b>Ctrl/Cmd + Shift + R</b> 强制刷新：</p>'
      + '<pre style="font-size:11px;color:#5a4046;background:#fff7fa;padding:8px;border-radius:8px;overflow:auto;max-height:200px;">'
      + String(detail || 'unknown').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'})[c])
      + '</pre>';
    el.appendChild(card);
  } catch (_) { /* swallow */ }
}
window.addEventListener('error', e => __paintGlobalError('error', (e && (e.error && (e.error.stack || e.error.message)) || e.message || 'unknown')));
window.addEventListener('unhandledrejection', e => __paintGlobalError('promise', (e && e.reason && (e.reason.stack || e.reason.message)) || String(e && e.reason) || 'unknown'));

(async function boot() {
  try {
    await loadQuestions();
    renderEntry();
    if (storage.get('tacit_role')) initMain();
  } catch (e) {
    showBootError(e);
  }
})();

// 兜底 3s：如果 entryArea 仍然空白且 mainArea 隐藏，说明 boot 卡住了，
// 强制把当前页面状态画到 entryArea，给用户一个明确的"加载失败/卡住"提示。
setTimeout(() => {
  try {
    const entry = document.getElementById('entryArea');
    const main  = document.getElementById('mainArea');
    if (!entry || !main) return;
    if (entry.innerHTML.trim()) return; // 已经有内容，正常
    if (main.style.display !== 'none' && main.children.length > 0) return; // 主区已渲染
    __paintGlobalError('timeout', '页面启动 3 秒后仍未渲染任何内容。\n可能原因：浏览器扩展拦截 / 内联脚本被禁用 / 网络极慢。\n请尝试：\n1. Ctrl/Cmd + Shift + R 强制刷新\n2. 换一个浏览器（建议 Safari / Chrome 最新版）\n3. 用本地直接打开 file:// 试试');
  } catch (_) { /* swallow */ }
}, 3000);
</script>
