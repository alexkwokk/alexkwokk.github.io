<style>

    width: 100%;

  body {
    display: grid;

  }

  .line {
    font-weight: 300;
    letter-spacing: 0.02em;
    text-align: center;
    line-height: 1.3;
  }

  .line.title {
    font-size: clamp(2rem, 7vw, 4rem);
    margin-bottom: clamp(0.5rem, 2vh, 1rem);
  }

  .line.zh {
    font-size: clamp(1.05rem, 2.6vw, 1.35rem);

  }

    margin-top: clamp(0.5rem, 2vh, 1rem);

    display: inline-block;
    margin: 0 0.25em;
    color: #e63946;

<body>
  <div class="poem">

    <div class="line zh">我看清了一件事情</div>
    <div class="line zh">我很内耗</div>
    <div class="line zh">近乎疯狂的内耗</div>
    <div class="line zh">我希望表现的很从容、洒脱</div>
    <div class="line zh">但我真的很内耗和矛盾</div>
    <div class="line zh">总是在推算，按照最悲观的结果来推算</div>
    <div class="line zh">“我已经想过最坏的结果了，那即使它到来了，我也就能接受了吧”</div>
    <div class="line zh">但，好可怜</div>
    <div class="line zh">用不完全的信息，不充分的条件，即使是毕生所学也不够成熟的算法</div>
    <div class="line zh">以为算尽了自己的一生</div>
    <div class="line zh">能够换来一丝确定感</div>
    <div class="line zh">"是不是只要我再想一遍，再仔细一点，再努力一点，我就能想通。"</div>
    <div class="line zh">到最后，痛苦、遗憾才是结局</div>
    <div class="line zh">表面上说没有任何人能够影响我</div>
    <div class="line zh">实际上，我恐惧、焦虑、不自信、过度解读</div>
    <div class="line zh">我希望有人能给我一些确定性的东西</div>
    <div class="line zh">“是的，就是这样”</div>
    <div class="line zh"></div>

  </div>
