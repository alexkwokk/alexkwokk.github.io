    <title>答案之书</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f5f3ef;
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px;
            color: #2c2c2c;
            line-height: 1.8;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            padding-bottom: 40px;
            border-bottom: 1px solid #d4d0c8;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            margin-bottom: 20px;
            color: #1a1a1a;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #888;
            font-weight: 300;
            letter-spacing: 0.1em;
        }

        .mode-selector {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 50px;
        }

        .mode-btn {
            padding: 10px 0;
            font-size: 0.95rem;
            font-family: inherit;
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 0.1em;
        }

        .mode-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 1px;
            background: #2c2c2c;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .mode-btn:hover {
            color: #2c2c2c;
        }

        .mode-btn.active {
            color: #2c2c2c;
        }

        .mode-btn.active::after {
            width: 100%;
        }

        .controls {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-bottom: 50px;
            animation: fadeIn 0.5s ease;
        }

        .controls.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .number-input {
            width: 160px;
            padding: 12px 15px;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid #ccc;
            background: #fff;
            color: #2c2c2c;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .number-input:focus {
            border-color: #2c2c2c;
        }

        .number-input::placeholder {
            color: #bbb;
        }

        .action-btn {
            padding: 12px 30px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid #2c2c2c;
            background: transparent;
            color: #2c2c2c;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.1em;
            border-radius: 2px;
        }

        .action-btn:hover {
            background: #2c2c2c;
            color: #fff;
        }

        .hint {
            font-size: 0.9rem;
            color: #999;
            font-weight: 300;
        }

        .result-container {
            display: none;
            background: #fff;
            border: 1px solid #e8e4dc;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.03);
            animation: resultAppear 0.6s ease;
        }

        .result-container.show {
            display: block;
        }

        @keyframes resultAppear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-prompt {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 35px;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .answer-label {
            font-size: 0.8rem;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .answer {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 35px;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .explanation {
            font-size: 0.95rem;
            line-height: 2;
            color: #666;
            text-align: left;
            font-weight: 300;
            border-top: 1px solid #eee;
            padding-top: 25px;
            margin-top: 25px;
        }

        .page-num {
            display: inline-block;
            margin-top: 30px;
            color: #ccc;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
        }

        .reset-btn {
            margin-top: 30px;
            padding: 10px 25px;
            font-size: 0.85rem;
            font-family: inherit;
            border: 1px solid #ddd;
            background: transparent;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.1em;
            border-radius: 2px;
        }

        .reset-btn:hover {
            border-color: #2c2c2c;
            color: #2c2c2c;
        }

        .loading {
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.1em;
        }

        .error-msg {
            color: #c00;
            text-align: center;
            font-size: 0.9rem;
            padding: 20px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #d4d0c8;
            margin: 60px auto;
        }

        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid #d4d0c8;
        }

        .footer p {
            font-size: 0.8rem;
            color: #bbb;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

            body { padding: 50px 20px; }
            h1 { font-size: 1.6rem; letter-spacing: 0.2em; }
            .mode-selector { gap: 25px; }
            .mode-btn { font-size: 0.9rem; }
            .result-container { padding: 35px 25px; }
            .answer { font-size: 1.4rem; }
            .explanation { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>答案之书</h1>
            <p class="subtitle">闭目凝神，心有所问</p>
        </header>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="random">随机抽取</button>
            <button class="mode-btn" data-mode="number">输入页码</button>
        </div>

        <div id="random-controls" class="controls show">
            <p class="hint">心中默念问题，而后抽取</p>
            <button class="action-btn" id="random-btn">开始</button>
        </div>

        <div id="number-controls" class="controls">
            <div class="input-group">
                <input type="number" class="number-input" id="page-input" placeholder="1 - 337" min="1" max="337">
                <button class="action-btn" id="submit-btn">确认</button>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            正在翻阅...
        </div>

        <div id="error" class="error-msg" style="display: none;"></div>

        <div id="result" class="result-container">
            <p class="question-prompt">你的问题是...</p>
            <p class="answer-label">答案</p>
            <p class="answer" id="answer-text"></p>
            <p class="explanation" id="explanation-text"></p>
            <span class="page-num" id="page-num"></span>
            <button class="reset-btn" id="reset-btn">再来一次</button>
        </div>

        <div class="divider"></div>

        <footer class="footer">
            <p>共三百三十七页</p>
        </footer>
    </div>

            {"page": 330, "answer": "等待", "explanation": "意味著需要保持耐心，不要急於求成。"},
            {"page": 331, "answer": "本頁前第三個答案", "explanation": "查看答案"},
            {"page": 332, "answer": "那一定很棒", "explanation": "是一種積極、樂觀的表達，它表示對某件事情或情境的期待和肯定。"},
            {"page": 333, "answer": "你可能不得不放棄其他一些東西", "explanation": "這句話的意思是，在追求某個目標或做出某個選擇時，可能需要放棄其他一些東西。"},
            {"page": 334, "answer": "是時候走了", "explanation": "這句話意味著一個階段或情況已經結束，是時候離開或繼續前進了。"},
            {"page": 335, "answer": "這肯定會使事情變的有趣", "explanation": "這句話傳達了積極和樂觀的態度。"},
            {"page": 336, "answer": "說出來吧", "explanation": "這句話鼓勵人們要勇敢地表達自己的想法和感受。"},
            {"page": 337, "answer": "", "explanation": ""}
        ];

        const modeBtns = document.querySelectorAll('.mode-btn');
        const randomControls = document.getElementById('random-controls');
        const numberControls = document.getElementById('number-controls');
        const randomBtn = document.getElementById('random-btn');
        const submitBtn = document.getElementById('submit-btn');
        const pageInput = document.getElementById('page-input');
        const resultContainer = document.getElementById('result');
        const answerText = document.getElementById('answer-text');
        const explanationText = document.getElementById('explanation-text');
        const pageNum = document.getElementById('page-num');
        const resetBtn = document.getElementById('reset-btn');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');

        let currentMode = 'random';

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.dataset.mode;
                if (mode === currentMode) return;

                currentMode = mode;
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                randomControls.classList.remove('show');
                numberControls.classList.remove('show');
                resultContainer.classList.remove('show');
                errorDiv.style.display = 'none';

                if (mode === 'random') {
                    randomControls.classList.add('show');
                } else {
                    numberControls.classList.add('show');
                }
            });
        });

        function resolveAnswer(page) {
            const data = answersData.find(a => a.page === page);
            if (!data) return null;

            if (data.answer.includes('本頁前')) {
                const match = data.answer.match(/本頁前第(\d+)個答案/);
                if (match) {
                    const offset = parseInt(match[1]);
                    return resolveAnswer(page - offset);
                }
            } else if (data.answer.includes('本頁後')) {
                const match = data.answer.match(/本頁後第(\d+)個答案/);
                if (match) {
                    const offset = parseInt(match[1]);
                    return resolveAnswer(page + offset);
                }
            }

            return data;
        }

        function showAnswer(data) {
            if (!data || !data.answer) {
                errorDiv.textContent = '此页暂无答案，请选择其他页码';
                errorDiv.style.display = 'block';
                resultContainer.classList.remove('show');
                return;
            }

            loading.style.display = 'none';
            errorDiv.style.display = 'none';
            answerText.textContent = data.answer;
            explanationText.textContent = data.explanation;
            pageNum.textContent = `第 ${data.page} 页`;
            resultContainer.classList.add('show');
        }

        randomBtn.addEventListener('click', () => {
            loading.style.display = 'block';
            resultContainer.classList.remove('show');
            errorDiv.style.display = 'none';

            setTimeout(() => {
                let randomPage;
                do {
                    randomPage = Math.floor(Math.random() * 337) + 1;
                } while (randomPage === 325 || randomPage === 337);

                const data = resolveAnswer(randomPage);
                showAnswer(data);
            }, 600);
        });

        submitBtn.addEventListener('click', () => {
            const page = parseInt(pageInput.value);

            if (isNaN(page) || page < 1 || page > 337) {
                errorDiv.textContent = '请输入 1 至 337 之间的数字';
                errorDiv.style.display = 'block';
                resultContainer.classList.remove('show');
                return;
            }

            loading.style.display = 'block';
            resultContainer.classList.remove('show');
            errorDiv.style.display = 'none';

            setTimeout(() => {
                const data = resolveAnswer(page);
                showAnswer(data);
            }, 400);
        });

        pageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });

        resetBtn.addEventListener('click', () => {
            resultContainer.classList.remove('show');
            pageInput.value = '';
            errorDiv.style.display = 'none';
        });
    </script>
</body>
</html>
