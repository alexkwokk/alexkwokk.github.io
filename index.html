<style>
  :root {
    color-scheme: light;
    --ink: #252725;
    --muted: #777a74;
    --accent: #836655;
    --accent-deep: #604d41;
    --paper: rgba(251, 250, 247, 0.92);
    --line: rgba(37, 39, 37, 0.16);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    overflow-x: hidden;
    background: #f3f2ee;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;

  .page {
    position: relative;
    isolation: isolate;
    width: min(100% - 40px, 940px);
    min-height: 100vh;
    margin: 0 auto;
    padding: clamp(56px, 10vh, 104px) 0 44px;
  }

  .page::before,
  .page::after {
    position: fixed;
    z-index: -1;
    display: block;
    background: rgba(37, 39, 37, 0.08);
    content: "";
    pointer-events: none;
  }

  .page::before {
    top: 0;
    bottom: 0;
    left: max(20px, calc((100vw - 940px) / 2));
    width: 1px;
  }

  .page::after {
    top: 0;
    right: max(20px, calc((100vw - 940px) / 2));
    left: max(20px, calc((100vw - 940px) / 2));
    height: 1px;

  .intro {

    font-weight: 600;
    letter-spacing: 0.24em;

  .eyebrow::before {
    width: 36px;
    height: 1px;
    background: currentColor;
    content: "";

    font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;

    font-weight: 400;

  .heart {

    font-size: 0.68em;

  .intro p {

    font-size: clamp(1rem, 2.2vw, 1.14rem);
    letter-spacing: 0.06em;
    line-height: 1.8;
  }

  .letters {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(16px, 3vw, 26px);
  }

  .entry {
    position: relative;
    display: flex;
    min-height: 270px;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    padding: clamp(25px, 4vw, 36px);
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    box-shadow: 0 10px 28px rgba(37, 39, 37, 0.05);
    color: inherit;
    text-decoration: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  }

  .entry::after {
    position: absolute;
    right: 28px;
    bottom: 28px;
    width: 46px;
    height: 1px;
    background: var(--accent);
    content: "";
    opacity: 0.45;
    transition: width 0.25s ease, opacity 0.25s ease;
  }

  .entry:hover,
  .entry:focus-visible {
    border-color: rgba(96, 77, 65, 0.5);
    box-shadow: 0 16px 34px rgba(37, 39, 37, 0.1);
    transform: translateY(-3px);
  }

  .entry:hover::after,
  .entry:focus-visible::after {
    width: 68px;
    opacity: 0.8;
  }

  .entry:focus-visible {
    outline: 2px solid rgba(96, 77, 65, 0.45);
    outline-offset: 4px;
  }

  .entry-top,
  .entry-bottom {
    position: relative;
    z-index: 1;
  }

  .date {
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.18em;
  }

  .entry h2 {
    margin-top: 22px;
    font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
    font-size: clamp(1.45rem, 3vw, 2rem);
    font-weight: 400;
    letter-spacing: 0.03em;
    line-height: 1.35;
  }

  .entry-description {
    max-width: 28em;
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.8;
  }

  .read-link {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: var(--accent-deep);
    font-size: 0.84rem;
    font-weight: 600;
    letter-spacing: 0.1em;
  }

  .arrow {
    display: inline-block;
    font-size: 1.1rem;
    transition: transform 0.3s ease;
  }

  .entry:hover .arrow,
  .entry:focus-visible .arrow {
    transform: translateX(5px);
  }

  footer {
    margin-top: clamp(44px, 8vh, 72px);
    color: rgba(119, 122, 116, 0.9);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-align: left;

  @media (max-width: 640px) {

    }

    .entry {

  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
